[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-btc-correlation-beta-filtering-system"
version = "1.0.0"
description = "Crypto BTC-Correlation & Beta Filtering System — filters altcoins by BTC correlation and beta"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Crypto BTC Correlation Team" }]
keywords = ["crypto", "btc", "correlation", "beta", "filtering"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Financial and Insurance Industry",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "pandas>=2.0,<3.0",
  "numpy>=1.24,<2.0",
  "scipy>=1.10,<2.0",
  "statsmodels>=0.14,<1.0",
  "ccxt>=4.2,<5.0",
  "requests>=2.31,<3.0",
  "pyyaml>=6.0,<7.0",
  "matplotlib>=3.7,<4.0",
  "tqdm>=4.66,<5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4,<9.0",
  "pytest-cov>=4.0,<7.0",
  "ruff>=0.8,<1.0",
  "mypy>=1.10,<2.0",
  "pandas-stubs",
  "types-PyYAML",
  "types-requests",
]

[project.urls]
Homepage = "https://github.com/example/crypto-btc-correlation"
Repository = "https://github.com/example/crypto-btc-correlation"
Issues = "https://github.com/example/crypto-btc-correlation/issues"

[project.scripts]
btc-beta-filter = "main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=src --cov-report=term-missing --cov-fail-under=70"
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "integration: marks tests as integration tests",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 70

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
exclude = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".git", "__pycache__", ".venv", "venv", "build", "dist", ".pytest_cache"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
